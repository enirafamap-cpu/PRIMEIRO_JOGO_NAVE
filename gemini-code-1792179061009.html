<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Invaders - PWA Mobile Landscape</title>
  <style>
    body { background: #000; color: #fff; text-align: center; font-family: monospace; margin: 0; padding: 10px; overflow: hidden; touch-action: none; }
    h1 { font-size: 16px; margin: 5px 0; }
    canvas { border: 2px solid #fff; background: #111; display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .controls { display: flex; justify-content: space-around; margin-top: 10px; width: 100%; max-width: 700px; margin-left: auto; margin-right: auto; }
    .btn { background: #333; color: #fff; border: 2px solid #fff; padding: 12px 24px; font-size: 16px; font-family: monospace; border-radius: 8px; user-select: none; }
    .btn:active { background: #555; }
  </style>
</head>
<body>
  <h1>Space Invaders - Mobile</h1>
  <canvas id="gameCanvas" width="700" height="350"></canvas>
  <div class="controls">
    <button class="btn" id="leftBtn">◀</button>
    <button class="btn" id="shootBtn">ATIRAR</button>
    <button class="btn" id="rightBtn">▶</button>
  </div>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let score = 0, lives = 3, gameState = "PLAYING";
    const player = { x: 325, y: 310, width: 30, height: 18, speed: 5, dx: 0 };
    let bullets = [], enemyBullets = [], enemies = [];
    let enemyDirection = 1, enemySpeed = 1;

    function initEnemies() {
      enemies = [];
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 10; col++) {
          enemies.push({ x: 40 + col * 60, y: 30 + row * 30, width: 28, height: 18, alive: true });
        }
      }
    }
    initEnemies();

    // Controles Touch
    const bindTouch = (id, actionStart, actionEnd) => {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); actionStart(); });
      el.addEventListener("touchend", (e) => { e.preventDefault(); actionEnd(); });
      el.addEventListener("mousedown", (e) => { e.preventDefault(); actionStart(); });
      el.addEventListener("mouseup", (e) => { e.preventDefault(); actionEnd(); });
    };

    bindTouch("leftBtn", () => player.dx = -player.speed, () => { if(player.dx < 0) player.dx = 0; });
    bindTouch("rightBtn", () => player.dx = player.speed, () => { if(player.dx > 0) player.dx = 0; });
    bindTouch("shootBtn", () => {
      if (gameState === "GAMEOVER" || gameState === "VICTORY") {
        score = 0; lives = 3; gameState = "PLAYING"; initEnemies(); bullets = []; enemyBullets = [];
        return;
      }
      if (bullets.length < 3) {
        bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
      }
    }, () => {});

    // Teclado opcional para testes no PC
    document.addEventListener("keydown", (e) => {
      if (gameState === "GAMEOVER" || gameState === "VICTORY") {
        if (e.key === "Enter") { score = 0; lives = 3; gameState = "PLAYING"; initEnemies(); bullets = []; enemyBullets = []; }
        return;
      }
      if (e.key === "ArrowLeft") player.dx = -player.speed;
      if (e.key === "ArrowRight") player.dx = player.speed;
      if (e.key === " " || e.code === "Space") {
        if (bullets.length < 3) bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
      }
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") player.dx = 0;
    });

    function update() {
      if (gameState !== "PLAYING") return;

      player.x += player.dx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        if (b.y < 0) { bullets.splice(i, 1); continue; }
        let bulletRemoved = false;
        for (let j = 0; j < enemies.length; j++) {
          let e = enemies[j];
          if (e.alive && b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
            e.alive = false;
            bullets.splice(i, 1);
            score += 100;
            bulletRemoved = true;
            break;
          }
        }
        if (bulletRemoved) continue;
      }

      let hitEdge = false;
      let activeEnemies = enemies.filter(e => e.alive);
      if (activeEnemies.length === 0) { gameState = "VICTORY"; return; }

      activeEnemies.forEach(e => {
        e.x += enemyDirection * enemySpeed;
        if (e.x <= 10 || e.x + e.width >= canvas.width - 10) hitEdge = true;
      });

      if (hitEdge) {
        enemyDirection *= -1;
        enemies.forEach(e => { 
          e.y += 12; 
          if (e.y + e.height >= player.y) gameState = "GAMEOVER"; 
        });
      }

      if (Math.random() < 0.025 && activeEnemies.length > 0) {
        let shooter = activeEnemies[Math.floor(Math.random() * activeEnemies.length)];
        enemyBullets.push({ x: shooter.x + shooter.width / 2, y: shooter.y + shooter.height, width: 4, height: 10, speed: 4 });
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.y += eb.speed;
        if (eb.y > canvas.height) { enemyBullets.splice(i, 1); continue; }
        if (eb.x < player.x + player.width && eb.x + eb.width > player.x && eb.y < player.y + player.height && eb.y + eb.height > player.y) {
          enemyBullets.splice(i, 1);
          lives--;
          if (lives <= 0) gameState = "GAMEOVER";
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff";
      ctx.font = "14px monospace";
      ctx.fillText(`Placar: ${score}`, 15, 25);
      ctx.fillText(`Vidas: ${lives}`, canvas.width - 80, 25);

      if (gameState === "GAMEOVER") {
        ctx.fillStyle = "red"; ctx.font = "26px monospace"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "12px monospace"; ctx.fillText("Toque em 'ATIRAR' para Reiniciar", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left"; return;
      }
      if (gameState === "VICTORY") {
        ctx.fillStyle = "green"; ctx.font = "26px monospace"; ctx.textAlign = "center";
        ctx.fillText("VITÓRIA!", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "12px monospace"; ctx.fillText("Toque em 'ATIRAR' para Jogar de Novo", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left"; return;
      }

      ctx.fillStyle = "#0f0"; ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillStyle = "#ff0"; bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
      ctx.fillStyle = "#f0f"; enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.width, eb.height));
      ctx.fillStyle = "#f00"; enemies.forEach(e => { if (e.alive) ctx.fillRect(e.x, e.y, e.width, e.height); });
    }

    function loop() { update(); render(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
